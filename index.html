<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="2;url=https://onlyfans.com/karollinaa/c55">
    <title>Cargando...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: #0088cc;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        a {
            color: #58a6ff;
            text-decoration: none;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <p>Cargando contenido exclusivo, por favor espera...</p>
    <a href="https://onlyfans.com/arianavibes/c90">Haz clic aquí si no redirige automáticamente</a>
</body>
</html>
